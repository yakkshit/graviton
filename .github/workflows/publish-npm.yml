name: Publish CLI to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'npm package name override (default: graviton or @yakkshit/graviton)'
        required: false
        default: ''

jobs:
  publish-npm:
    name: Publish Graviton CLI to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-v2-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-v2-

      - name: Install dependencies
        run: bun install

      - name: Build and Test CLI
        run: |
          cd packages/cli
          bun run build
          bun test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package_name || secrets.NPM_PACKAGE_NAME || '@yakkshit/graviton' }}
        run: |
          cd packages/cli

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ ERROR: NPM_TOKEN secret is not set or empty in GitHub Secrets!"
            echo "Please go to GitHub Repo -> Settings -> Secrets and variables -> Actions and add NPM_TOKEN."
            exit 1
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc

          npm pkg set name="${PACKAGE_NAME}"
          echo "Publishing to npm as '${PACKAGE_NAME}' with --access public..."
          npm publish --access public
          echo "🎉 Successfully published to npm as '${PACKAGE_NAME}'!"
