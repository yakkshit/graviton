name: Publish CLI to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'npm package name override (default: graviton or @yakkshit/graviton)'
        required: false
        default: ''

jobs:
  publish-npm:
    name: Publish Graviton CLI to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and Test CLI
        run: |
          cd packages/cli
          bun run build
          bun test

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DESIRED_PACKAGE_NAME: ${{ inputs.package_name || secrets.NPM_PACKAGE_NAME || 'graviton' }}
          FALLBACK_PACKAGE_NAME: '@yakkshit/graviton'
        run: |
          cd packages/cli
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

          # Try publishing under desired package name first
          npm pkg set name="${DESIRED_PACKAGE_NAME}"
          echo "Attempting publish with package name '${DESIRED_PACKAGE_NAME}'..."

          if npm publish --access public; then
            echo "Successfully published to npm as '${DESIRED_PACKAGE_NAME}'!"
          else
            echo "Publish as '${DESIRED_PACKAGE_NAME}' failed or name is restricted."
            echo "Falling back automatically to '${FALLBACK_PACKAGE_NAME}'..."
            npm pkg set name="${FALLBACK_PACKAGE_NAME}"
            npm publish --access public
            echo "Successfully published to npm as '${FALLBACK_PACKAGE_NAME}'!"
          fi
