name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/cockpit/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'turbo.json'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (all, web, cockpit)'
        required: true
        default: 'all'

jobs:
  deploy-web:
    name: Deploy Marketing Site (apps/web)
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'web' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/web

  deploy-cockpit:
    name: Deploy Cockpit WebUI (apps/cockpit)
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'cockpit' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_COCKPIT || secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./apps/cockpit
