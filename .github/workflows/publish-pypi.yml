name: Publish CLI to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  compile-binaries:
    name: Compile Native Binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            artifact: graviton-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: graviton-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: graviton-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: graviton-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: graviton-win-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        shell: bash
        run: |
          cd packages/cli
          mkdir -p bin
          bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile bin/${{ matrix.artifact }}
          chmod +x bin/${{ matrix.artifact }} || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/cli/bin/${{ matrix.artifact }}
          if-no-files-found: error

  publish-pypi:
    name: Build Python Wheel & Publish to PyPI
    needs: compile-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: python -m pip install --upgrade pip build twine hatchling

      - name: Download all compiled binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/graviton-artifacts
          merge-multiple: true

      - name: Populate packages/python/bin directory
        run: |
          mkdir -p packages/python/bin
          cp -r /tmp/graviton-artifacts/* packages/python/bin/
          chmod +x packages/python/bin/* || true
          ls -la packages/python/bin/

      - name: Build Python sdist and wheel
        run: |
          cd packages/python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/python/dist/
