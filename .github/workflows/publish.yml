name: Publish Graviton to npm & PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (all, npm, pypi)'
        required: true
        default: 'all'

jobs:
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    if: "${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'npm' || github.event_name == 'release' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Graviton CLI
        run: bun run --cwd packages/cli build

      - name: Publish to npm (Try 'graviton', fallback to '@yakkshit/graviton')
        run: |
          cd packages/cli
          # 1. Attempt publishing as ungrouped 'graviton'
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            pkg.name = "graviton";
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "Attempting to publish as 'graviton'..."
          if npm publish --access public; then
            echo "Successfully published to npm as 'graviton'!"
          else
            echo "'graviton' is taken or unauthorized. Falling back to '@yakkshit/graviton'..."
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
              pkg.name = "@yakkshit/graviton";
              fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
            '
            npm publish --access public
            echo "Successfully published to npm as '@yakkshit/graviton'!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish CLI to PyPI
    runs-on: ubuntu-latest
    if: "${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'pypi' || github.event_name == 'release' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: |
          cd packages/graviton-cli
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: packages/graviton-cli/dist/
