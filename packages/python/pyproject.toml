[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graviton-cli"
version = "1.0.0"
description = "Your code is the center. AI orbits it. The self-hosted, zero-trust AI coding cockpit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Venkata Sai Yakkshit Reddy Asodi", email = "yakkshit@proton.me" }
]
keywords = ["ai", "mcp", "coding", "security", "zero-trust", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/yakkshit/graviton"
Repository = "https://github.com/yakkshit/graviton"

[project.scripts]
graviton = "graviton_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["graviton_cli"]
artifacts = ["bin/*"]

[tool.hatch.build.targets.sdist]
include = [
    "/graviton_cli",
    "/bin",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]

